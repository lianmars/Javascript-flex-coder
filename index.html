<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Simulador de Préstamos</title>
</head>

<body>

    <div class="container">

        <h1>Simulador de Préstamos</h1>
        <p class="subtitle">Calcula el monto de tu cuota mensual</p>


        <div class="card">

            <div class="form-group">
                <label>Monto ($)</label>
                <input type="number" id="monto" placeholder="Ej: 100000">
            </div>

            <div class="form-group">
                <label>Meses a pagar</label>
                <input type="number" id="meses" placeholder="Ej: 12">
            </div>

            <div class="form-group">
                <label>Tipo de Préstamo</label>
                <select id="tipo-prestamo">
                    <option value="" disabled selected>Cargando opciones...</option>
                </select>
            </div>

            <button id="calcular">Calcular</button>

        </div>


        <div class="result-card">

            <h2>Resultado</h2>

            <div class="result-item">
                <span>Cuota mensual</span>
                <strong id="cuota">$0.00</strong>
            </div>

            <div class="result-item">
                <span>Intereses</span>
                <strong id="intereses">$0.00</strong>
            </div>

            <div class="result-item">
                <span>Total a pagar</span>
                <strong id="total">$0.00</strong>
            </div>

            <button id="confirmar" class="btn-confirmar">✔ Confirmar Préstamo</button>

        </div>

        <button id="ver-historial" class="btn-historial">📋 Ver historial</button>

        <div id="historial-container" class="historial-container">
            <h2>Historial de Préstamos</h2>
            <div id="historial-lista"></div>
            <button id="limpiar-historial" class="btn-limpiar">🗑 Limpiar historial</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="apps.js"></script>
</body>

</html>
